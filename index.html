<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    :root {
      --bg: #f5f5f4;
      --surface: #ffffff;
      --key: #f0f0ef;
      --key-hover: #e6e6e4;
      --text: #1c1c1c;
      --muted: #8a8a88;
      --accent: #2f6fed;
      --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --surface: #1c1c1c;
        --key: #2a2a2a;
        --key-hover: #353535;
        --text: #f2f2f2;
        --muted: #8a8a88;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .calc {
      width: 100%;
      max-width: 320px;
      background: var(--surface);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    .display {
      text-align: right;
      padding: 8px 4px 20px;
      min-height: 96px;
    }
    .expr {
      font-size: 14px;
      color: var(--muted);
      min-height: 20px;
    }
    .value {
      font-size: 44px;
      font-weight: 300;
      overflow-wrap: anywhere;
      line-height: 1.1;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      border: 0;
      border-radius: 14px;
      height: 60px;
      font: inherit;
      font-size: 20px;
      background: var(--key);
      color: var(--text);
      cursor: pointer;
      transition: background 0.12s;
    }
    button:hover { background: var(--key-hover); }
    button:active { transform: scale(0.97); }
    button.op { color: var(--accent); }
    button.fn { color: var(--muted); }
    button.eq { background: var(--accent); color: var(--accent-text); }
    button.zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calc">
    <div class="display" aria-live="polite">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">0</div>
    </div>
    <div class="keys">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="sign">±</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="op" data-op="*">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="op" data-op="-">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal">.</button>
      <button class="eq" data-action="equals">=</button>
    </div>
  </main>

  <script>
    const valueEl = document.getElementById('value');
    const exprEl = document.getElementById('expr');
    const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

    let current = '0';      // number being typed
    let previous = null;    // stored left operand
    let operator = null;    // pending operator
    let fresh = false;      // next digit starts a new number

    function compute(a, b, op) {
      switch (op) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return b === 0 ? NaN : a / b;
      }
    }

    function format(n) {
      if (!isFinite(n)) return 'Error';
      return String(parseFloat(n.toPrecision(12)));
    }

    function render() {
      valueEl.textContent = current;
      exprEl.textContent = operator ? `${previous} ${symbols[operator]}` : '';
    }

    function inputDigit(d) {
      if (fresh || current === 'Error') { current = d; fresh = false; }
      else current = current === '0' ? d : current + d;
    }

    function inputDecimal() {
      if (fresh || current === 'Error') { current = '0.'; fresh = false; }
      else if (!current.includes('.')) current += '.';
    }

    function setOperator(op) {
      if (current === 'Error') return;
      if (operator && !fresh) {
        current = format(compute(parseFloat(previous), parseFloat(current), operator));
        if (current === 'Error') { previous = operator = null; fresh = true; return; }
      }
      previous = current;
      operator = op;
      fresh = true;
    }

    function equals() {
      if (!operator || current === 'Error') return;
      current = format(compute(parseFloat(previous), parseFloat(current), operator));
      previous = operator = null;
      fresh = true;
    }

    function clear() {
      current = '0'; previous = operator = null; fresh = false;
    }

    const actions = {
      clear,
      equals,
      decimal: inputDecimal,
      sign: () => { if (current !== '0' && current !== 'Error') current = format(-parseFloat(current)); },
      percent: () => { if (current !== 'Error') current = format(parseFloat(current) / 100); },
    };

    document.querySelector('.keys').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.dataset.digit) inputDigit(btn.dataset.digit);
      else if (btn.dataset.op) setOperator(btn.dataset.op);
      else actions[btn.dataset.action]();
      render();
    });

    document.addEventListener('keydown', e => {
      const k = e.key;
      if (/^[0-9]$/.test(k)) inputDigit(k);
      else if (k in symbols) setOperator(k);
      else if (k === '.') inputDecimal();
      else if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); }
      else if (k === 'Escape') clear();
      else if (k === 'Backspace') {
        if (fresh || current === 'Error') return;
        current = current.length > 1 ? current.slice(0, -1) : '0';
      }
      else if (k === '%') actions.percent();
      else return;
      render();
    });
  </script>
</body>
</html>
